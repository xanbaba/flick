[project]
name = "flick"
version = "0.1.0"
description = "Flick — a semantic brain-computer interface for assistive communication."
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "structlog>=24.1",
  "pyzmq>=26.0",
  "numpy>=1.26",
  "scipy>=1.13",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "ruff>=0.6",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
