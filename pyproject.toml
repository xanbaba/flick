[project]
name = "flick"
version = "0.1.0"
description = "Flick — a semantic brain-computer interface for assistive communication."
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "structlog>=24.1",
  "pyzmq>=26.0",
  "websocket-client>=1.8",
  "numpy>=1.26",
  "scipy>=1.13",
  "kuzu>=0.11.3",
  "fastapi>=0.141.1",
  "uvicorn[standard]>=0.54.0",
  "httpx>=0.28.1",
  "asyncpg>=0.31.0",
  "python-multipart>=0.0.32",
  "sentence-transformers>=6.1.0",
  "faster-whisper>=1.2.1",
  "sounddevice>=0.5.6",
  "webrtcvad-wheels>=2.0.14",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "ruff>=0.6",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
